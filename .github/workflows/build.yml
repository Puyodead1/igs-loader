name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libsdl2-dev
      - name: Build
        # core/font.h is committed; keep build.sh from regenerating it (needs PIL and a font)
        run: |
          touch core/font.h
          bash build.sh
      - name: Package
        # build/igs-mkromset is the rom-set builder (finds hash/ one up); build/igs-assets the game data tool
        run: |
          test -x build/igs-mkromset
          test -x build/igs-assets
          build/igs-assets formats >/dev/null
          test -x build/igs-loader-gui
          mkdir -p dist/igs-loader
          cp -a build lib hash run.sh play.ps1 igs-loader.ini.example dist/igs-loader/
          rm -rf dist/igs-loader/build/obj
      - uses: actions/upload-artifact@v7
        with:
          name: igs-loader-linux
          path: dist

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the mingw-w64 i686 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686-posix g++-mingw-w64-i686-posix
      - name: Build
        run: |
          touch core/font.h
          bash win/build-win.sh
      - name: Package
        # igs-loader.exe and igs-mkromset.exe find hash\ and igs-loader.ini next to themselves
        run: |
          test -f build/win/igs-mkromset.exe
          test -f build/win/igs-assets.exe
          test -f build/win/igs-loader-gui.exe
          mkdir -p dist/igs-loader
          cp -a build/win/. hash igs-loader.ini.example dist/igs-loader/
      - uses: actions/upload-artifact@v7
        with:
          name: igs-loader-windows
          path: dist
